name: Feature request
description: Propose a focused improvement and explain the problem it solves.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Check the roadmap and existing issues first. Do not include secrets, personal identifiers, device information, machine paths, or screenshots of private phone screens. A proposal is not a release commitment.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues and the roadmap.
          required: true
        - label: This request contains no secrets, personal identifiers, or private phone screenshots.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe a concrete workflow using generic or synthetic examples.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and acceptance criteria
      description: Explain what a successful result would look like and how it could be tested.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: Include any new device access, data handling, or platform requirements.
